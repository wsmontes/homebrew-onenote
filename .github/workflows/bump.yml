name: Update formula

on:
  # The schedule is paused while GitHub Actions is unavailable on the maintainer
  # account (billing lock); re-add `schedule: [{cron: "17 4 * * *"}]` then.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read the newest upstream release
        id: up
        run: |
          tag=$(curl -sSfL https://api.github.com/repos/wsmontes/one-note-converter/releases/latest | jq -r .tag_name)
          test -n "$tag" -a "$tag" != null
          sha=$(curl -sSfL "https://github.com/wsmontes/one-note-converter/archive/refs/tags/${tag}.tar.gz" | sha256sum | cut -d' ' -f1)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Rewrite the formula
        env:
          TAG: ${{ steps.up.outputs.tag }}
          SHA: ${{ steps.up.outputs.sha }}
        run: |
          perl -0pi -e 's|/refs/tags/v[0-9][^/"]*\.tar\.gz|/refs/tags/$ENV{TAG}.tar.gz|' Formula/onenote2md.rb
          perl -0pi -e 's|sha256 "[0-9a-f]{64}"|sha256 "$ENV{SHA}"|' Formula/onenote2md.rb
      - name: Commit when it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/onenote2md.rb
          if git diff --staged --quiet; then echo "already current"; exit 0; fi
          git commit -m "onenote2md: update to ${{ steps.up.outputs.tag }}"
          git push
